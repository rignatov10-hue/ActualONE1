[project]
name = "drive-data-analyst"
version = "0.1.0"
description = "Conversational data analyst agent that answers questions from CSVs in Google Drive."
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents==1.1.0",
    "mistralai-workflows[mistralai]",
    "pandas>=2.2",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
